name: CI and ECR

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: codebase/rdicidr-0.1.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '15.14.0'

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Test
        run: CI=true npm run test

      - name: Build
        run: npm run build

  publish:
    name: Publish image to ECR
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          allowed-account-ids: '753226848084'

      - name: Build and publish image
        shell: bash
        run: |
          set -euo pipefail
          : "${AWS_REGION:?Configure AWS_REGION}"
          : "${ECR_REPOSITORY:?Configure ECR_REPOSITORY with the repository name}"
          IMAGE_URI=$(aws ecr describe-repositories \
            --repository-names "$ECR_REPOSITORY" \
            --region "$AWS_REGION" \
            --query 'repositories[0].repositoryUri' --output text)
          REGISTRY="${IMAGE_URI%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" | \
            docker login --username AWS --password-stdin "$REGISTRY"
          docker build --tag "$IMAGE_URI:$IMAGE_TAG" ./codebase/rdicidr-0.1.0
          docker push "$IMAGE_URI:$IMAGE_TAG"
          printf 'Published image: `%s`\n' "$IMAGE_URI:$IMAGE_TAG" >> "$GITHUB_STEP_SUMMARY"
